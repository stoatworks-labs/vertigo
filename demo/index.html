  <body>
    <main id="demo">
      <noscript>
        <h1>Vertigo</h1>
        <p>
          An FFGL effect that does the shot where the camera tracks backwards
          while the lens zooms in, so one surface stays the size it was and
          everything at any other distance moves. It can make up the depth it
          needs, so it works on any clip, or it can read a real depth map out of
          the picture.
        </p>
        <p>
          This demo runs the plugin's shader in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/vertigo">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/vertigo/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/vertigo/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/vertigo">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
